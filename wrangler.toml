# Cloudflare Worker and static PWA deployment configuration.
name = "hyperion-pwa"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
keep_vars = true

# Keep these disabled on every deployment; dashboard toggles alone are overwritten.
# Production is served through the existing hyperionmaritime.org custom domain.
workers_dev = false
preview_urls = false

# Required by Cloudflare Workers Builds for branch/PR preview deployments.
# No preview-specific runtime bindings. Preview URL exposure is disabled above.
previews = {}

[assets]
binding = "ASSETS"
run_worker_first = ["/api/question-bank/*"]
directory = "./dist"
not_found_handling = "single-page-application"
