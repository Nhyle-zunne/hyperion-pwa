name: Generate Bun lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/generate-lockfiles.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Generate Bun lockfile
        run: bun install --lockfile-only

      - name: Commit lockfile to the pull request branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git add bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Bun dependency lockfile generated by Bun 1.4.4"
          git push origin "HEAD:${HEAD_REF}"
