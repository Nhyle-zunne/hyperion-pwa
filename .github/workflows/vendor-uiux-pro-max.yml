name: Vendor UI UX Pro Max (one-time)
on:
  push:
    branches: [chore/install-ui-ux-pro-max-20261114]
    paths: [.github/workflows/vendor-uiux-pro-max.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned upstream Codex skill
        run: |
          npx --yes ui-ux-pro-max-cli@2.15.0 init --ai codex
          test -s .agents/skills/ui-ux-pro-max/SKILL.md
          test -s .agents/skills/ui-ux-pro-max/scripts/search.py
          test -s .agents/skills/ui-ux-pro-max/data/ux-guidelines.csv
      - name: Verify skill searches
        run: |
          case "$GITHUB_REPOSITORY" in
            */hyperion-pwa) stack=react ;;
            */hyperion-reviewer) stack=jetpack-compose ;;
            */hyperion-books) stack=flutter ;;
            *) exit 1 ;;
          esac
          python3 .agents/skills/ui-ux-pro-max/scripts/search.py "responsive dashboard" --stack "$stack" >/tmp/uiux-stack.txt
          test -s /tmp/uiux-stack.txt
          python3 .agents/skills/ui-ux-pro-max/scripts/search.py "touch target accessibility" --domain ux >/tmp/uiux-ux.txt
          test -s /tmp/uiux-ux.txt
      - name: Pin all vendor files and register repo instructions
        run: |
          mkdir -p .agents/licenses/ui-ux-pro-max
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/nextlevelbuilder/ui-ux-pro-max-skill/v2.15.0/LICENSE" -o .agents/licenses/ui-ux-pro-max/LICENSE
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, existsSync, readdirSync, lstatSync } from "node:fs"
          import { createHash } from "node:crypto"
          import path from "node:path"
          const root = ".agents/skills/ui-ux-pro-max"
          const files = []
          function scan(dir) {
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              const target = path.posix.join(dir, entry.name)
              if (lstatSync(target).isSymbolicLink()) throw Error("Symlink not allowed: " + target)
              if (entry.isDirectory()) scan(target)
              else if (entry.isFile()) files.push(target)
            }
          }
          scan(root)
          files.push(".agents/licenses/ui-ux-pro-max/LICENSE")
          files.sort()
          const record = {
            name: "ui-ux-pro-max",
            repository: "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git",
            commit: "a38d04c3d5c298c851dbe5e6ee1965ee3de42cb5",
            npmPackage: "ui-ux-pro-max-cli@2.15.0",
            skills: ["ui-ux-pro-max"],
            files: files.map(destination => ({
              source: destination.replace(".agents/skills/ui-ux-pro-max/", "ui-ux-pro-max-cli@2.15.0/"),
              destination,
              sha256: createHash("sha256").update(readFileSync(destination)).digest("hex")
            }))
          }
          const manifestPath = ".agents/upstream-lock.json"
          const manifest = existsSync(manifestPath) ? JSON.parse(readFileSync(manifestPath, "utf8")) : {version: 1, sources: []}
          if (manifest.sources.some(x => x.name === record.name)) throw Error("Existing UI skill; review before overwrite")
          manifest.sources.push(record)
          writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n")
          const note = [
            "",
            "## UI/UX Pro Max — native repository skill",
            "",
            "For interface, visual design, layout, accessibility, responsiveness, touch interaction, typography, and animation, read .agents/skills/ui-ux-pro-max/SKILL.md. Use its Python search script with react for Hyperion PWA, jetpack-compose for Android, and flutter for Hyperion Books. Preserve Hyperion branding and approved layouts. Do not use for purely backend changes.",
            "",
            "The skill is pinned to the ui-ux-pro-max-cli@2.15.0 package, with local file hashes in .agents/upstream-lock.json. No app dependencies or automatic updates. From the repository root, use: python3 .agents/skills/ui-ux-pro-max/scripts/search.py \"mobile navigation touch\" --domain ux.",
            ""
          ].join("\n")
          const instructions = readFileSync("AGENTS.md", "utf8")
          if (!instructions.includes("## UI/UX Pro Max — native repository skill")) writeFileSync("AGENTS.md", instructions.trimEnd() + "\n" + note)
          const testPath = "scripts/tests/agent-skills-test.mjs"
          if (existsSync(testPath)) {
            let test = readFileSync(testPath, "utf8")
            if (!test.includes("names.size, 17")) throw Error("Unexpected skill test: review required")
            test = test.replace("names.size, 17, 'Expected 15 Superpowers skills, Ponytail, and Caveman'", "names.size, 18, 'Expected 15 Superpowers skills, Ponytail, Caveman, and UI/UX Pro Max'")
            test = test.replace("['using-superpowers', 'ponytail', 'caveman']", "['using-superpowers', 'ponytail', 'caveman', 'ui-ux-pro-max']")
            writeFileSync(testPath, test)
          }
          console.log("Pinned", record.files.length, "UI/UX Pro Max vendor files")
          NODE
      - name: Validate vendor manifest
        run: |
          if [ -f scripts/tests/agent-skills-test.mjs ]; then
            node scripts/tests/agent-skills-test.mjs
          else
            node -e 'const fs=require("fs"), crypto=require("crypto"); const m=JSON.parse(fs.readFileSync(".agents/upstream-lock.json","utf8")); for(const s of m.sources)for(const f of s.files)if(crypto.createHash("sha256").update(fs.readFileSync(f.destination)).digest("hex")!==f.sha256)throw Error(f.destination); if(!fs.readFileSync(".agents/skills/ui-ux-pro-max/SKILL.md","utf8").startsWith("---\\nname: ui-ux-pro-max"))throw Error("Invalid frontmatter"); console.log("PASS: pinned UI/UX Pro Max files")'
          fi
      - name: Commit to isolated branch and remove installer
        run: |
          git add .agents/skills/ui-ux-pro-max .agents/licenses/ui-ux-pro-max .agents/upstream-lock.json AGENTS.md
          if [ -f scripts/tests/agent-skills-test.mjs ]; then git add scripts/tests/agent-skills-test.mjs; fi
          git rm .github/workflows/vendor-uiux-pro-max.yml
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "chore: vendor UI/UX Pro Max native Codex skill"
          git push origin HEAD:chore/install-ui-ux-pro-max-20261114
