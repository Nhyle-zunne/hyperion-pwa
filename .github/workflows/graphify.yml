name: Graphify code map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.dart'
      - '**/*.sql'
      - '.graphifyignore'
      - '.github/workflows/graphify.yml'
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.dart'
      - '**/*.sql'
      - '.graphifyignore'
      - '.github/workflows/graphify.yml'

permissions:
  contents: read

jobs:
  source-map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build local-only Graphify source graph
        run: uvx --from graphifyy==0.9.108 graphify extract . --code-only
      - name: Verify graph was generated
        run: test -s graphify-out/graph.json
      - name: Retain map for code investigation
        uses: actions/upload-artifact@v4
        with:
          name: graphify-code-map
          path: graphify-out/graph.json
          if-no-files-found: error
          retention-days: 7
