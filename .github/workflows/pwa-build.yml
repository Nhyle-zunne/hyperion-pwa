name: PWA build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify repository agent skills
        run: node scripts/tests/agent-skills-test.mjs
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Set up Deno for Supabase Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check protected question-bank and Google Play subscription functions
        run: deno check --no-lock --node-modules-dir=auto supabase/functions/question-bank/index.ts supabase/functions/learning-progress/index.ts supabase/functions/admin-payment-review/index.ts supabase/functions/link-google-play-subscription/index.ts supabase/functions/google-play-rtdn/index.ts supabase/functions/create-checkout/index.ts supabase/functions/verify-checkout/index.ts supabase/functions/paymongo-webhook/index.ts supabase/functions/submit-manual-payment/index.ts supabase/functions/admin-license-management/index.ts supabase/functions/expire-inactive-accounts/index.ts supabase/functions/record-user-activity/index.ts supabase/functions/reconcile-google-play-subscriptions/index.ts
      - name: Test Google Play account-binding safeguards
        run: deno test --no-lock --allow-env --node-modules-dir=auto supabase/tests/google_play_account_binding_test.ts supabase/tests/google_play_reconcile_noop_test.ts supabase/tests/learning_progress_preservation_test.ts supabase/tests/learning_progress_archive_batch_test.ts supabase/tests/learning_progress_conditional_read_test.ts supabase/tests/learning_progress_sections_test.ts supabase/tests/record_user_activity_throttle_test.ts supabase/tests/question_bank_public_auth_policy_test.ts supabase/tests/github_delivery_access_test.ts
      # Deno's --node-modules-dir=auto creates a second Vite/Rollup type
      # tree under node_modules/.deno; TypeScript then sees incompatible plugin
      # types from two installations. The Deno checks already finished.
      - name: Remove Deno-only npm type tree before Bun build
        run: rm -rf node_modules/.deno
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Release-safety smoke checks
        env:
          GITHUB_BANK_READ_TOKEN: ${{ secrets.BANK_READ_TOKEN }}
        run: |
          bun run test:security
          node scripts/tests/payment-polling-test.mjs
          node scripts/tests/order-history-requests-test.mjs
          node scripts/tests/admin-license-payload-test.mjs
          node scripts/tests/paymongo-verification-test.mjs
          node scripts/tests/production-auth-build-test.mjs
          node scripts/generate-worker-bank-codec.mjs --check
          node scripts/tests/github-release-source-test.mjs
          node scripts/tests/github-bank-publisher-test.mjs
          node scripts/tests/github-publisher-transaction-test.mjs
          node scripts/tests/github-bank-delivery-test.mjs
          node scripts/tests/smart-bank-download-plan-test.mjs
          bun test scripts/tests/github-offline-version.test.ts
          bun test scripts/tests/github-download-revision.test.ts
      - name: Saved-data database and offline-license regressions
        run: |
          bun run test:saved-data:sql
          bun run test:progress-revisions
          bun run test:offline-licenses
          bun test scripts/tests/license-refresh.test.ts
          bun test scripts/tests/license-clock-skew.test.ts
          bun test scripts/tests/cloud-progress-access.test.ts
          bun test scripts/tests/local-progress-identity.test.ts
          bun test scripts/tests/question-bank-transport.test.ts
          bun test scripts/tests/retired-c10.test.ts
          bun test scripts/tests/question-bank-picker.test.ts
          bun test scripts/tests/question-bank-editor.test.ts
          bun test scripts/tests/progress-request-policy.test.ts
          bun test scripts/tests/account-activity-policy.test.ts
          bun test scripts/tests/session-archive-batch.test.ts
      - name: Install Chromium for saved-data regression
        run: bunx playwright install --with-deps chromium
      - name: Saved-data browser regression
        run: bun run test:saved-data:browser
      - name: Background sync request and archive batching regression
        env:
          HYPERION_BROWSER_FIXTURE: sync
        run: bun run test:saved-data:browser
      - name: Free-local and licensed progress lifecycle regression
        env:
          HYPERION_BROWSER_FIXTURE: licensed
        run: bun run test:saved-data:browser
      - name: GitHub publisher browser regression
        env:
          HYPERION_BROWSER_FIXTURE: publisher
        run: bun run test:saved-data:browser
      - name: Account profile layout browser regression
        env:
          HYPERION_BROWSER_FIXTURE: account
        run: bun run test:saved-data:browser
      - name: Scored session results browser regression
        env:
          HYPERION_BROWSER_FIXTURE: results
        run: bun run test:saved-data:browser
      - name: Practice hard-refresh exact-session regression
        env:
          HYPERION_BROWSER_FIXTURE: practice-refresh
        run: bun run test:saved-data:browser
      - name: Type-check and build
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then unset VITE_SUPABASE_URL; fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then unset VITE_SUPABASE_ANON_KEY; fi
          bun run build
      - name: Verify generated offline app shell
        run: bun run test:offline-build
      - name: Retain the verified production bundle for Cloudflare deployment
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-pwa-dist
          path: dist/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Deploy verified PWA to the existing Hyperion Worker
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: e4f2b51a3c1a61a5ba56a7d5cf1d8f45
          wranglerVersion: '4'
          command: deploy
      - name: Verify Worker production and preview URLs stay disabled
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/verify-worker-domains.mjs
      - name: Verify the public site serves the deployed build
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          node scripts/verify-live-release.mjs
          node scripts/verify-bank-release.mjs

  google-play-migration-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hyperion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hyperion_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply Google Play migration to an isolated PostgreSQL database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hyperion_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE
            AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261029184029_add_google_play_purchase_links.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/google_play_subscription_atomic.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA vault;
          CREATE TABLE vault.decrypted_secrets (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            name text NOT NULL UNIQUE,
            decrypted_secret text NOT NULL,
            description text
          );
          INSERT INTO vault.decrypted_secrets(name, decrypted_secret)
            VALUES ('hyperion_supabase_project_url', 'https://test-project.supabase.co');

          CREATE FUNCTION vault.create_secret(p_secret text, p_name text, p_description text)
          RETURNS uuid LANGUAGE plpgsql AS $fn$
          DECLARE v_id uuid;
          BEGIN
            INSERT INTO vault.decrypted_secrets(name, decrypted_secret, description)
            VALUES (p_name, p_secret, p_description)
            ON CONFLICT (name) DO UPDATE SET decrypted_secret = EXCLUDED.decrypted_secret,
                                                description = EXCLUDED.description
            RETURNING id INTO v_id;
            RETURN v_id;
          END;
          $fn$;

          CREATE SCHEMA cron;
          CREATE TABLE cron.job (
            jobid bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            jobname text NOT NULL UNIQUE,
            schedule text NOT NULL,
            command text NOT NULL
          );
          CREATE FUNCTION cron.unschedule(p_jobid bigint) RETURNS boolean
          LANGUAGE plpgsql AS $fn$
          BEGIN
            DELETE FROM cron.job WHERE jobid = p_jobid;
            RETURN FOUND;
          END;
          $fn$;
          CREATE FUNCTION cron.schedule(p_jobname text, p_schedule text, p_command text) RETURNS bigint
          LANGUAGE plpgsql AS $fn$
          DECLARE v_jobid bigint;
          BEGIN
            INSERT INTO cron.job(jobname, schedule, command)
            VALUES (p_jobname, p_schedule, p_command)
            ON CONFLICT (jobname) DO UPDATE SET schedule = EXCLUDED.schedule,
                                                command = EXCLUDED.command
            RETURNING jobid INTO v_jobid;
            RETURN v_jobid;
          END;
          $fn$;

          CREATE SCHEMA net;
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE OR REPLACE FUNCTION extensions.gen_random_bytes(p_bytes integer) RETURNS bytea
          LANGUAGE sql IMMUTABLE AS $fn$
            SELECT pg_catalog.decode(pg_catalog.repeat('ab', p_bytes), 'hex')
          $fn$;
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261029184034_schedule_google_play_reconciliation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $tests$
          DECLARE
            v_token text;
          BEGIN
            SELECT decrypted_secret INTO v_token
              FROM vault.decrypted_secrets
             WHERE name = 'hyperion_google_play_reconciliation_cron_token';
            IF v_token IS NULL OR pg_catalog.length(v_token) < 48 THEN
              RAISE EXCEPTION 'A private Google Play reconciliation token was not created';
            END IF;
            IF (SELECT decrypted_secret FROM vault.decrypted_secrets
                WHERE name = 'hyperion_google_play_reconciliation_enabled') <> 'false' THEN
              RAISE EXCEPTION 'Periodic Google Play reconciliation must default to disabled';
            END IF;
            IF public.verify_google_play_reconciliation_cron_token(v_token) IS DISTINCT FROM false THEN
              RAISE EXCEPTION 'Reconciliation token must be rejected while the enable flag is false';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM cron.job
               WHERE jobname = 'hyperion-reconcile-google-play-subscriptions'
                 AND schedule = '*/15 * * * *'
                 AND command LIKE '%hyperion_google_play_reconciliation_enabled%'
                 AND command LIKE '%net.http_post%'
            ) THEN
              RAISE EXCEPTION 'The guarded 15-minute reconciliation job was not registered';
            END IF;
            IF pg_catalog.has_function_privilege('anon', 'public.verify_google_play_reconciliation_cron_token(text)', 'EXECUTE')
               OR NOT pg_catalog.has_function_privilege('service_role', 'public.verify_google_play_reconciliation_cron_token(text)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Reconciliation-token verifier privileges are not restricted to service_role';
            END IF;

            UPDATE vault.decrypted_secrets
               SET decrypted_secret = 'true'
             WHERE name = 'hyperion_google_play_reconciliation_enabled';
            IF public.verify_google_play_reconciliation_cron_token(v_token) IS DISTINCT FROM true THEN
              RAISE EXCEPTION 'Reconciliation token did not validate when explicitly enabled';
            END IF;
          END;
          $tests$;
          SQL

      - name: Set up Node.js for revision concurrency tests
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Revision storage concurrency and rollback (synthetic PostgreSQL)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hyperion_test
        run: |
          node scripts/tests/progress-revision-pg-test.mjs
          node scripts/tests/paymongo-reconciliation-pg-test.mjs
