name: PWA build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Set up Deno for Supabase Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Google Play subscription Edge Function
        run: deno check --no-lock --node-modules-dir=auto supabase/functions/link-google-play-subscription/index.ts supabase/functions/google-play-rtdn/index.ts
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Release-safety smoke checks
        run: bun run test:security
      - name: Type-check and build
        run: bun run build
      - name: Verify generated offline app shell
        run: bun run test:offline-build
